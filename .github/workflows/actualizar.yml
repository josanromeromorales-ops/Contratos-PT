name: Actualizar contratos de Pinto

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      historico:
        description: "Año desde el que cargar el histórico (dejar vacío para la actualización normal)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-contratos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Descargar datos de Hacienda y generar el Excel
        # margen para que, si se agota el tiempo, los pasos siguientes guarden lo avanzado
        timeout-minutes: 320
        env:
          PYTHONUNBUFFERED: "1"
          HISTORICO: ${{ github.event.inputs.historico }}
        run: |
          if [ -n "$HISTORICO" ]; then
            python pinto_contratos.py --historico "$HISTORICO" --borrar-descargas
          else
            python pinto_contratos.py
          fi

      - name: Guardar los datos en el repositorio
        if: always() && hashFiles('datos_contratos_pinto.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add datos_contratos_pinto.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualización de contratos $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Publicar el Excel (siempre en el mismo enlace)
        if: always() && hashFiles('contratos_pinto.xlsx') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view datos >/dev/null 2>&1 || \
            gh release create datos --title "Contratos del Ayuntamiento de Pinto" \
              --notes "Excel actualizado automáticamente cada día con los datos abiertos de la Plataforma de Contratación del Sector Público."
          gh release upload datos contratos_pinto.xlsx --clobber

      - name: Guardar el Excel también como resultado de la ejecución
        if: always() && hashFiles('contratos_pinto.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: contratos_pinto
          path: contratos_pinto.xlsx
          retention-days: 30
