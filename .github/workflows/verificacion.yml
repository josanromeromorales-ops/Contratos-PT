name: Verificación con Rendición de Cuentas

# Descarga el listado de contratos de Pinto de rendiciondecuentas.es para
# compararlo con el Excel. Solo se lanza a mano; no modifica los datos.

on:
  workflow_dispatch:
    inputs:
      desde:
        default: "2020"
      hasta:
        default: "2025"

permissions:
  contents: write

jobs:
  rendicion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verificacion/rendicion_cuentas.py "${{ github.event.inputs.desde }}" "${{ github.event.inputs.hasta }}" rendicion_cuentas.csv
        env:
          PYTHONUNBUFFERED: "1"
      - name: Guardar el resultado en la rama "verificacion" (no toca main)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/out && cp rendicion_cuentas.csv /tmp/out/ && cp -r debug /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan verificacion
          git rm -rfq .
          cp -r /tmp/out/* .
          git add -A
          git commit -qm "Listado de Rendición de Cuentas $(date -u +%Y-%m-%d)"
          git push -f origin verificacion
